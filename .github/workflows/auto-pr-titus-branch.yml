name: Auto PR — titus/* branch

on:
  push:
    branches:
      - 'titus/**'

concurrency:
  group: pr-titus-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  create-pr:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - name: Create draft PR to main
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          set -e
          BRANCH="${{ github.ref_name }}"
          TITLE="$(git log -1 --format=%s)"

          # Check for existing PR
          EXISTING=$(gh pr list --head "$BRANCH" --base main --json number --jq '.[].number' 2>/dev/null || true)

          if [ -n "$EXISTING" ]; then
            echo "PR #$EXISTING already exists for $BRANCH — skipping."
            exit 0
          fi

          echo "Creating draft PR for $BRANCH → main..."
          gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "$TITLE" \
            --body "Auto-generated from ${BRANCH}. Merge when ready, then delete." \
            --draft
          echo "Draft PR created."
