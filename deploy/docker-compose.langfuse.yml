# Langfuse — LLM Observability Platform
# https://langfuse.com/docs/deployment/docker
#
# Langfuse v3+ configuration.
#
# Primary location: ~/langfuse/docker-compose.yml
# Run with: docker compose up -d
# Access at: http://localhost:3000
#
# NOTE: Replace example.com with your own domain, or use localhost for local-only.
#
# IMPORTANT: After changing env vars or this file, ALWAYS run:
#   docker compose -f docker-compose.langfuse.yml down
#   docker compose -f docker-compose.langfuse.yml up -d
# (docker compose restart does NOT re-read env vars)

services:
  langfuse-worker:
    image: langfuse/langfuse-worker:3.1.0
    restart: always
    depends_on: &langfuse-depends-on
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment: &langfuse-env-base
      # ── Database ──
      DATABASE_URL: postgresql://postgres:${LANGFUSE_POSTGRES_PASSWORD}@postgres:5432/postgres

      # ── ClickHouse (required by v3) ──
      CLICKHOUSE_URL: http://default:${LANGFUSE_CLICKHOUSE_PASSWORD:?}@clickhouse:8123
      CLICKHOUSE_MIGRATION_URL: clickhouse://default:${LANGFUSE_CLICKHOUSE_PASSWORD:?}@clickhouse:9000
      CLICKHOUSE_CLUSTER_ENABLED: "false"
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: ${LANGFUSE_CLICKHOUSE_PASSWORD:?Missing LANGFUSE_CLICKHOUSE_PASSWORD in .env}

      # ── Redis ──
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_AUTH: ${LANGFUSE_REDIS_AUTH:?Missing LANGFUSE_REDIS_AUTH in .env}

      # ── MinIO (local S3) ──
      MINIO_ACCESS_KEY: ${LANGFUSE_MINIO_ACCESS_KEY:?Missing LANGFUSE_MINIO_ACCESS_KEY in .env}
      MINIO_SECRET_KEY: ${LANGFUSE_MINIO_SECRET_KEY:?Missing LANGFUSE_MINIO_SECRET_KEY in .env}
      MINIO_ENDPOINT: minio:9000

      # ── Auth / Encryption ──
      SALT: ${LANGFUSE_SALT:?Missing LANGFUSE_SALT in .env}
      SECRET_KEY: ${LANGFUSE_SECRET_KEY:?Missing LANGFUSE_SECRET_KEY in .env}
      NEXTAUTH_SECRET: ${LANGFUSE_NEXTAUTH_SECRET:?Missing LANGFUSE_NEXTAUTH_SECRET in .env}
      # Generate with: openssl rand -hex 32
      LANGFUSE_ENCRYPTION_KEY: ${LANGFUSE_ENCRYPTION_KEY:?Missing LANGFUSE_ENCRYPTION_KEY in .env}

      # ── Telemetry / Privacy ──
      NEXT_TELEMETRY_DISABLED: "1"
      LANGFUSE_TELEMETRY_ENABLED: "false"

      # ── Access Control ──
      AUTH_DISABLE_SIGNUP: "true"

      # ── Logging ──
      LANGFUSE_LOG_LEVEL: ${LANGFUSE_LOG_LEVEL:-info}

      # ── API defaults ──
      LANGFUSE_API_TRACES_REJECT_NO_DATE_RANGE: ${LANGFUSE_API_TRACES_REJECT_NO_DATE_RANGE:-true}
      LANGFUSE_API_TRACES_DEFAULT_DATE_RANGE_DAYS: ${LANGFUSE_API_TRACES_DEFAULT_DATE_RANGE_DAYS:-7}

      # ── S3 Event Log / OpenTelemetry ──
      LANGFUSE_ENABLE_BLOB_STORAGE_FILE_LOG: "true"
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://localhost:4318}
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-langfuse}

      # ── S3 Event Upload (required by v3 — uses local MinIO) ──
      LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: ${LANGFUSE_MINIO_ACCESS_KEY:?Missing LANGFUSE_MINIO_ACCESS_KEY in .env}
      LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: ${LANGFUSE_MINIO_SECRET_KEY:?Missing LANGFUSE_MINIO_SECRET_KEY in .env}
      LANGFUSE_S3_EVENT_UPLOAD_BUCKET: langfuse
      LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: http://minio:9000
      LANGFUSE_S3_EVENT_UPLOAD_REGION: us-east-1
      LANGFUSE_S3_EVENT_UPLOAD_USE_SSL: "false"
      LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: "true"
      LANGFUSE_S3_EVENT_UPLOAD_PREFIX: events/

      # ── S3 Media Upload (required by v3 — uses local MinIO) ──
      LANGFUSE_S3_MEDIA_UPLOAD_ACCESS_KEY_ID: ${LANGFUSE_MINIO_ACCESS_KEY:?Missing LANGFUSE_MINIO_ACCESS_KEY in .env}
      LANGFUSE_S3_MEDIA_UPLOAD_SECRET_ACCESS_KEY: ${LANGFUSE_MINIO_SECRET_KEY:?Missing LANGFUSE_MINIO_SECRET_KEY in .env}
      LANGFUSE_S3_MEDIA_UPLOAD_BUCKET: langfuse-media
      LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT: http://minio:9000
      LANGFUSE_S3_MEDIA_UPLOAD_REGION: us-east-1
      LANGFUSE_S3_MEDIA_UPLOAD_USE_SSL: "false"
      LANGFUSE_S3_MEDIA_UPLOAD_FORCE_PATH_STYLE: "true"

      # ── S3 Batch Export (required by v3 — uses local MinIO) ──
      LANGFUSE_S3_BATCH_EXPORT_ACCESS_KEY_ID: ${LANGFUSE_MINIO_ACCESS_KEY:?Missing LANGFUSE_MINIO_ACCESS_KEY in .env}
      LANGFUSE_S3_BATCH_EXPORT_SECRET_ACCESS_KEY: ${LANGFUSE_MINIO_SECRET_KEY:?Missing LANGFUSE_MINIO_SECRET_KEY in .env}
      LANGFUSE_S3_BATCH_EXPORT_BUCKET: langfuse-export
      LANGFUSE_S3_BATCH_EXPORT_ENDPOINT: http://minio:9000
      LANGFUSE_S3_BATCH_EXPORT_REGION: us-east-1
      LANGFUSE_S3_BATCH_EXPORT_USE_SSL: "false"
      LANGFUSE_S3_BATCH_EXPORT_FORCE_PATH_STYLE: "true"

  langfuse-web:
    image: langfuse/langfuse:3.1.0
    restart: always
    depends_on: *langfuse-depends-on
    ports:
      - "127.0.0.1:${LANGFUSE_PORT:-3000}:3000"
    environment:
      <<: *langfuse-env-base
      HOSTNAME: "0.0.0.0"
      NEXTAUTH_URL: http://localhost:${LANGFUSE_PORT:-3000}
      LANGFUSE_INIT_ORG_ID: ${LANGFUSE_INIT_ORG_ID:-hermes-cortex}
      LANGFUSE_INIT_PROJECT_ID: ${LANGFUSE_INIT_PROJECT_ID:-default-project}
      LANGFUSE_INIT_PROJECT_PUBLIC_KEY: ${LANGFUSE_INIT_PROJECT_PUBLIC_KEY:-}
      LANGFUSE_INIT_PROJECT_SECRET_KEY: ${LANGFUSE_INIT_PROJECT_SECRET_KEY:-}
      LANGFUSE_INIT_PROJECT_NAME: ${LANGFUSE_INIT_PROJECT_NAME:-Hermes Agent}
      LANGFUSE_INIT_USER_EMAIL: ${LANGFUSE_INIT_USER_EMAIL:-}
      LANGFUSE_INIT_USER_NAME: ${LANGFUSE_INIT_USER_NAME:-admin}
      LANGFUSE_INIT_USER_PASSWORD: ${LANGFUSE_INIT_USER_PASSWORD:-}

  clickhouse:
    image: clickhouse/clickhouse-server:25.5-alpine
    restart: always
    # ── Resource limits: prevent CPU contention with agent services ──
    cpus: 0.5
    mem_limit: 1g
    healthcheck:
      test: ["CMD-SHELL", "clickhouse client -h localhost --query 'SELECT 1'"]
      interval: 5s
      timeout: 5s
      retries: 5
    environment:
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: ${LANGFUSE_CLICKHOUSE_PASSWORD:?Missing LANGFUSE_CLICKHOUSE_PASSWORD in .env}
    volumes:
      - langfuse-clickhouse-data:/var/lib/clickhouse
      - ./clickhouse-config.d/01-log-level.xml:/etc/clickhouse-server/config.d/01-log-level.xml:ro
      - ./clickhouse-config.d/02-low-memory.xml:/etc/clickhouse-server/config.d/02-low-memory.xml:ro
    ulimits:
      nofile:
        soft: 262144
        hard: 262144

  postgres:
    image: postgres:16-alpine
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - langfuse-postgres-data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: ${LANGFUSE_POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${LANGFUSE_POSTGRES_PASSWORD:?Missing LANGFUSE_POSTGRES_PASSWORD in .env}
      POSTGRES_DB: postgres

  redis:
    image: redis:7-alpine
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - langfuse-redis-data:/data
    command: redis-server --requirepass ${LANGFUSE_REDIS_AUTH:?Missing LANGFUSE_REDIS_AUTH in .env}

  minio:
    # ⚠️ PIN RECOMMENDED: Check https://hub.docker.com/r/minio/minio/tags
    #    for a stable release (e.g. minio/minio:RELEASE.2025-04-08T15-22-15Z).
    #    Pinning avoids unexpected breaking changes on `docker compose pull`.
    image: minio/minio:RELEASE.2025-06-01T00-00-00Z
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "mc ready local"]
      interval: 5s
      timeout: 5s
      retries: 5
    entrypoint: /bin/sh
    command: -c 'mkdir -p /data/langfuse /data/langfuse-media /data/langfuse-export && minio server /data --console-address ":9001"'
    volumes:
      - langfuse-minio-data:/data
    environment:
      MINIO_ROOT_USER: ${LANGFUSE_MINIO_ACCESS_KEY:?Missing LANGFUSE_MINIO_ACCESS_KEY in .env}
      MINIO_ROOT_PASSWORD: ${LANGFUSE_MINIO_SECRET_KEY:?Missing LANGFUSE_MINIO_SECRET_KEY in .env}

volumes:
  langfuse-clickhouse-data:
  langfuse-postgres-data:
  langfuse-redis-data:
  langfuse-minio-data:
