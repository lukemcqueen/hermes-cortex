# Docker Image Registry — Pull-Through Cache
# https://distribution.github.io/distribution/
#
# Caches Docker images from an upstream registry. Supports chaining:
#   Titus → Joseph → Docker Hub
#   Gisu  → Docker Hub
#   Kustos → Gisu  → Docker Hub
#
# Set UPSTREAM to the parent cache, or leave unset to proxy to Docker Hub:
#   UPSTREAM=http://joseph-host:5000    (Titus: chain to Joseph)
#   UPSTREAM=https://registry-1.docker.io  (default: Docker Hub)
#   (unset)                               (defaults to Docker Hub)
#
# Usage:
#   UPSTREAM=http://joseph-host:5000 docker compose -f docker-compose.registry.yml up -d
#   docker compose -f docker-compose.registry.yml up -d                  # direct to Hub
#
# See docs/registry-cache-architecture.md for full topology.

services:
  registry:
    image: registry:3
    restart: always
    ports:
      - "${REGISTRY_PORT:-127.0.0.1:5000}:5000"
    environment:
      # Upstream registry. Titus chains to Joseph; others chain to Docker Hub.
      REGISTRY_PROXY_REMOTEURL: ${UPSTREAM:-https://registry-1.docker.io}
      # Enable storage delete for garbage collection
      REGISTRY_STORAGE_DELETE_ENABLED: "true"
    volumes:
      - registry-data:/var/lib/registry
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5000/v2/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  registry-data:
