# Hermes Cortex — nginx Reverse Proxy Configuration
# ===================================================
#
# Production-grade template with all security hardening layers.
# Generic placeholders (app1, app2) — fill in your upstream ports.
#
# Zone definitions & maps live in hermes-zone-defs.conf (same directory)
# to avoid "already bound" errors when nginx.conf also defines them.
# Fresh installs: ensure both files are copied together.
#
# Port convention:
#   :13001 → first service
#   :13002 → second service
#   :13003 → third service
#   :13004+ → additional services
#
# Binds to 127.0.0.1 only by default. For external access:
#   - Add SSL certs
#   - Uncomment listen 443 ssl; comment listen 127.0.0.1:PORT;
#   - See docs/SECURITY.md for full hardening guide.
#
# CRITICAL — Single Listener Rule:
#   Each server block must have exactly ONE listen directive.
#   NEVER add "listen 127.0.0.1:PORT;" alongside "listen PORT ssl;" —
#   the plain listener catches TLS handshakes and returns 400.

# ── Zone definitions & maps (rate limiting, CSP, direct-IP blocker) ──
include hermes-zone-defs.conf;

# ── Upstream Backends ──

upstream app1_backend {
    server 127.0.0.1:8901;
}

upstream app2_backend {
    server 127.0.0.1:3000;
}

# ── App 1 — port 13001 ──
server {
    listen 127.0.0.1:13001;
    server_name localhost;

    # Layer 7: Basic Auth (active by default)
    auth_basic "Hermes Cortex — app1";
    auth_basic_user_file /usr/local/etc/nginx/.htpasswd;

    # Layer 4: Request size & timeouts
    client_max_body_size 10m;
    client_body_timeout 30s;
    client_header_timeout 30s;
    send_timeout 30s;
    keepalive_timeout 65s;

    # Layer 1: Security headers
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "DENY" always;
    add_header X-XSS-Protection          "0" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy        "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy   $csp_header always;
    add_header Cache-Control             "no-store, max-age=0" always;

    # Layer 2: Server header leak
    proxy_hide_header Server;
    add_header Server "Hermes" always;

    # Layer 6: Direct IP access denied (blocks scanning, allows localhost)
    if ($block_direct_ip) {
        return 444;
    }

    # Log paths
    #   macOS (Intel):  /usr/local/var/log/nginx/app1-{access,error}.log
    #   macOS (Silicon): /opt/homebrew/var/log/nginx/app1-{access,error}.log
    #   Linux:           /var/log/nginx/app1-{access,error}.log
    access_log  /usr/local/var/log/nginx/app1-access.log;
    error_log   /usr/local/var/log/nginx/app1-error.log;

    # Connection limit: max 10 concurrent per IP
    limit_conn conn_limit 10;

    # Layer 3: Sensitive path blocking
    location ~ /\.(git|env|svn|hg|idea|vscode|DS_Store|htpasswd) {
        deny all;
        return 404;
    }

    location / {
        # General rate limit: 20 req/s, burst 40
        limit_req zone=general burst=40 nodelay;
        # Stricter auth rate limit
        limit_req zone=auth burst=10 nodelay;

        proxy_pass http://app1_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# ── App 2 — port 13002 ──
server {
    listen 127.0.0.1:13002;
    server_name localhost;

    # Layer 7: Basic Auth (active by default)
    auth_basic "Hermes Cortex — app2";
    auth_basic_user_file /usr/local/etc/nginx/.htpasswd;

    # Layer 4: Request size & timeouts
    client_max_body_size 10m;
    client_body_timeout 30s;
    client_header_timeout 30s;
    send_timeout 30s;
    keepalive_timeout 65s;

    # Layer 1: Security headers
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "DENY" always;
    add_header X-XSS-Protection          "0" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy        "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy   $csp_header always;
    add_header Cache-Control             "no-store, max-age=0" always;

    # Layer 2: Server header leak
    proxy_hide_header Server;
    add_header Server "Hermes" always;

    # Layer 6: Direct IP access denied (blocks scanning, allows localhost)
    if ($block_direct_ip) {
        return 444;
    }

    # Log paths
    access_log  /usr/local/var/log/nginx/app2-access.log;
    error_log   /usr/local/var/log/nginx/app2-error.log;

    limit_conn conn_limit 10;

    # Layer 3: Sensitive path blocking
    location ~ /\.(git|env|svn|hg|idea|vscode|DS_Store|htpasswd) {
        deny all;
        return 404;
    }

    location / {
        limit_req zone=general burst=40 nodelay;
        limit_req zone=auth burst=10 nodelay;

        proxy_pass http://app2_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
    }
}

# ── Additional services — add server blocks at 13003, 13004, etc. ──
# Follow the same pattern above: auth, timeouts, headers, sensitive-path
# blocking, rate limits, connection limits.
