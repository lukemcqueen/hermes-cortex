# Hermes Cortex — nginx Reverse Proxy Configuration
# ===================================================
#
# Production-grade template with all security hardening layers.
# Generic placeholders (app1, app2) — fill in your upstream ports.
#
# Zone definitions & maps live in hermes-zone-defs.conf (same directory)
# to avoid "already bound" errors when nginx.conf also defines them.
# Fresh installs: ensure both files are copied together.
#
# OS-aware paths — substituted at deploy time by install-nginx.sh / cortex-update.sh:
#   __NGINX_CONFIG_DIR__ → /usr/local/etc/nginx (macOS Intel)
#                         → /opt/homebrew/etc/nginx (macOS Silicon)
#                         → /etc/nginx (Linux)
#   __NGINX_LOG_DIR__    → /usr/local/var/log/nginx (macOS Intel)
#                         → /opt/homebrew/var/log/nginx (macOS Silicon)
#                         → /var/log/nginx (Linux)
#   __HTPASSWD_FILE__    → __NGINX_CONFIG_DIR__/.htpasswd (macOS)
#                         → __NGINX_CONFIG_DIR__/.hermes-htpasswd (Linux)
#
# Port convention:
#   :xx001 → Cortex Dashboard
#   :xx002 → Langfuse
#   :xx003 → (available)
#   :xx004 → Agent Inbox
#   :xx007 → Health (NO AUTH — Moses polls this)
# Where xx is the agent prefix:
#   13 = generic/default (template ships with 13xxx)
#   12 = Joseph
#   14 = Esther
# cortex-update.sh auto-preserves the live port prefix on deploy.
# hermes-security-apply (agent-ip-submission cron) does NOT;
# keep the template at 13xxx and let cortex-update.sh translate.
#
# ALWAYS external SSL — nginx serves as the reverse proxy for external
# access. Every server block listens on its port with SSL. Cert paths
# are substituted from CORTEX_SSL_CERT_PATH / CORTEX_SSL_CERT_KEY_PATH
# env vars, auto-detected Let's Encrypt certs, or fallback.
# NEVER use listen 127.0.0.1:PORT (loopback) — this is intentional.
#
# CRITICAL — Single Listener Rule:
#   Each server block must have exactly ONE listen directive.
#   NEVER add "listen 127.0.0.1:PORT;" alongside "listen PORT ssl;" —
#   the plain listener catches TLS handshakes and returns 400.

# ── Manual IP allow list (overrides blocked_ips.conf) ──
# Create /etc/nginx/allow-ips-manual.conf with one `allow X.X.X.X;` per line.
# These IPs are NOT in git — manage locally. The deploy pipeline auto-strips
# allow-listed IPs from the block list so fail2ban cannot block them.
include /etc/nginx/allow-ips-manual.conf;

# ── Zone definitions & maps (rate limiting, CSP, direct-IP blocker) ──
include /etc/nginx/hermes-zone-defs.conf;
include /etc/nginx/blocked_ips.conf;

# ── Upstream Backends ──
upstream cortex_dashboard_backend {
    server 127.0.0.1:8901;
}

upstream langfuse_backend {
    server 127.0.0.1:3000;
}

upstream agent_inbox_backend {
    server 127.0.0.1:8904;
}

upstream health_backend {
    keepalive 32;
    server 127.0.0.1:8905;
}

upstream a2a_backend {
    keepalive 32;
    server 127.0.0.1:8906;
}

# ── App 1 — port 13001 (Cortex Dashboard) ──
server {
    listen 13001 ssl;
    server_name localhost;

    ssl_certificate     __SSL_CERT__;
    ssl_certificate_key __SSL_CERT_KEY__;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # Layer 7: Basic Auth (active by default)
    auth_basic "Hermes Cortex — App 1";
    auth_basic_user_file __HTPASSWD_FILE__;

    # Layer 4: Request size & timeouts
    client_max_body_size 10m;
    client_body_timeout 30s;
    client_header_timeout 30s;
    send_timeout 30s;
    keepalive_timeout 65s;

    # Layer 1: Security headers
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "DENY" always;
    add_header X-XSS-Protection          "0" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy        "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy   $csp_header always;
    add_header Cache-Control             "no-store, max-age=0" always;

    # Layer 2: Server header leak
    proxy_hide_header Server;
    add_header Server "Hermes" always;

    # Layer 6: Direct IP access denied (blocks scanning, allows localhost)
    if ($block_direct_ip) {
        return 444;
    }

    # Log paths — __NGINX_LOG_DIR__ is OS-substituted at deploy time
    access_log  __NGINX_LOG_DIR__/app1-access.log;
    error_log   __NGINX_LOG_DIR__/app1-error.log;

    # Connection limit: max 10 concurrent per IP
    limit_conn conn_limit 10;

    # Layer 3: Sensitive path blocking
    location ~ /\.(git|env|svn|hg|idea|vscode|DS_Store|htpasswd) {
        deny all;
        return 404;
    }

    location / {
        # General rate limit: 20 req/s, burst 40
        limit_req zone=general burst=40 nodelay;
        # Stricter auth rate limit
        limit_req zone=auth burst=10 nodelay;

        proxy_pass http://cortex_dashboard_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# ── App 2 — port 13002 (Langfuse) ──
server {
    listen 13002 ssl;
    server_name localhost;

    ssl_certificate     __SSL_CERT__;
    ssl_certificate_key __SSL_CERT_KEY__;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # Layer 7: Basic Auth (active by default)
    auth_basic "Hermes Cortex — App 2";
    auth_basic_user_file __HTPASSWD_FILE__;

    # Layer 4: Request size & timeouts
    client_max_body_size 10m;
    client_body_timeout 30s;
    client_header_timeout 30s;
    send_timeout 30s;
    keepalive_timeout 65s;

    # Layer 1: Security headers
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "DENY" always;
    add_header X-XSS-Protection          "0" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy        "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy   $csp_header always;
    add_header Cache-Control             "no-store, max-age=0" always;

    # Layer 2: Server header leak
    proxy_hide_header Server;
    add_header Server "Hermes" always;

    # Layer 6: Direct IP access denied (blocks scanning, allows localhost)
    if ($block_direct_ip) {
        return 444;
    }

    # Log paths — __NGINX_LOG_DIR__ is OS-substituted at deploy time
    access_log  __NGINX_LOG_DIR__/app2-access.log;
    error_log   __NGINX_LOG_DIR__/app2-error.log;

    limit_conn conn_limit 10;

    # Layer 3: Sensitive path blocking
    location ~ /\.(git|env|svn|hg|idea|vscode|DS_Store|htpasswd) {
        deny all;
        return 404;
    }

    location / {
        limit_req zone=general burst=40 nodelay;
        limit_req zone=auth burst=10 nodelay;

        proxy_pass http://langfuse_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
