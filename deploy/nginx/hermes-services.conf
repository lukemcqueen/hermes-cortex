        proxy_read_timeout 86400s;
    }
}

# ── Additional services — add server blocks at 13003, 13004, etc. ──

# ── App 4 — Agent Inbox — port 13004 ──
server {
    listen 13004 ssl;
    server_name localhost;

    ssl_certificate     __SSL_CERT__;
    ssl_certificate_key __SSL_CERT_KEY__;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # Layer 7: Basic Auth (active by default)
    auth_basic "Hermes Cortex — Agent Inbox";
    auth_basic_user_file __HTPASSWD_FILE__;

    # Layer 4: Request size & timeouts
    client_max_body_size 50m;
    client_body_timeout 30s;
    client_header_timeout 30s;
    send_timeout 30s;
    keepalive_timeout 65s;

    # Layer 1: Security headers
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "DENY" always;
    add_header X-XSS-Protection          "0" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy        "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy   $csp_header always;
    add_header Cache-Control             "no-store, max-age=0" always;

    # Layer 2: Server header leak
    proxy_hide_header Server;
    add_header Server "Hermes" always;

    # Layer 6: Direct IP access denied (blocks scanning, allows localhost)
    if ($block_direct_ip) {
        return 444;
    }

    access_log  __NGINX_LOG_DIR__/agent-inbox-access.log;
    error_log   __NGINX_LOG_DIR__/agent-inbox-error.log;

    limit_conn conn_limit 10;

    # Layer 3: Sensitive path blocking
    location ~ /\.(git|env|svn|hg|idea|vscode|DS_Store|htpasswd) {
        deny all;
        return 404;
    }

    # A2A Agent Card — public discovery endpoint (no auth)
    location = /.well-known/agent-card.json {
        auth_basic off;
        limit_req zone=general burst=40 nodelay;
        alias __CORTEX_HOME__/.hermes-cortex/a2a/agent-card.json;
        add_header Cache-Control "max-age=3600, public";
        add_header Access-Control-Allow-Origin "*";
    }

    # A2A Agent Card — authenticated endpoint (same data)
    location /a2a/agent-card {
        limit_req zone=general burst=40 nodelay;
        alias __CORTEX_HOME__/.hermes-cortex/a2a/agent-card.json;
        add_header Cache-Control "no-store, max-age=0";
    }

    # A2A Protocol — task delegation API (proxied to a2a-server on :8906)
    location /a2a/ {
        limit_req zone=general burst=40 nodelay;

        proxy_pass http://a2a_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    location / {
        limit_req zone=general burst=40 nodelay;
        limit_req zone=auth burst=10 nodelay;

        proxy_pass http://agent_inbox_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# ── Health Server — port xx007 (all agents) — NO AUTH ──
server {
    listen 13007 ssl;
    server_name localhost;

    ssl_certificate     __SSL_CERT__;
    ssl_certificate_key __SSL_CERT_KEY__;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    client_max_body_size 1m;
    client_body_timeout 10s;
    client_header_timeout 10s;
    send_timeout 10s;
    keepalive_timeout 30s;

    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "DENY" always;
    add_header Cache-Control             "no-store, max-age=0" always;
    proxy_hide_header Server;
    add_header Server "Hermes" always;

    if ($block_direct_ip) {
        return 444;
    }

    access_log  __NGINX_LOG_DIR__/health-access.log;
    error_log   __NGINX_LOG_DIR__/health-error.log;

    limit_conn conn_limit 10;

    location / {
        limit_req zone=general burst=10 nodelay;
        proxy_pass http://health_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
