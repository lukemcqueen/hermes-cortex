# Hermes Cortex — nginx Zone Definitions & Maps
# ===============================================
#
# Included by hermes-services.conf via __NGINX_CONFIG_DIR__/../hermes-zone-defs.conf.
# These live ONE directory above hermes-services.conf (parent of sites-enabled/
# or servers/) so nginx.conf globs don't reload them. Installing both files in
# the same globbed directory causes "already bound" errors on Linux.
#
# OS-aware deployment: install-nginx.sh copies this file to the parent of
# NGINX_CONFIG_DIR (e.g. /etc/nginx/ on Linux, /opt/homebrew/etc/nginx/ on
# macOS). cortex-update.sh and hermes-security-apply also handle placement.
# Paths are resolved at deploy time using OS detection.
#
# IMPORTANT: Never place this file inside sites-enabled/, servers/, conf.d/,
# or any directory glob-included by nginx.conf — it will be loaded twice.

# ── Rate Limiting Zones ──
limit_req_zone  $binary_remote_addr zone=general:10m rate=20r/s;
limit_req_zone  $binary_remote_addr zone=auth:10m   rate=5r/s;

# ── Connection Limiting ──
limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

# ── CSP Fallback Map ──
# Provides a strict CSP when the upstream doesn't send one.
map $upstream_http_content_security_policy $csp_header {
    default "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'";
    ~.     $upstream_http_content_security_policy;
}

# ── Direct-IP Blocker Map ──
# Returns 1 when Host is a bare IP that isn't localhost or 127.x.x.x.
map $host $block_direct_ip {
    default     0;
    "~*^127\."      0;
    "~*^localhost$" 0;
    "~^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$" 1;
}
