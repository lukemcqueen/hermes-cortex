# Hermes Cortex — fail2ban filter: nginx bad bots
#
# Detects archive-type file scanners and /storage/ path crawlers.
# These are common probes that enumerate backup files, tarballs,
# and storage directories on nginx reverse proxies.
#
# Install: copy to /usr/local/etc/fail2ban/filter.d/nginx-badbots.conf
# Enable: add to jail.local:
#   [nginx-badbots]
#   enabled  = true
#   port     = http,https
#   filter   = nginx-badbots
#   logpath  = /usr/local/var/log/nginx/*-access.log
#   maxretry = 3
#   bantime  = 86400
#   findtime = 3600

[Definition]

failregex = ^<HOST> -.*"(GET|POST|HEAD)\s+\/.*\.(tar|gz|bz2|xz|zip|rar|7z|sql|dump|backup|old|bak|sqlite|db|log|env|config|conf|pem|key|crt|cer|p12|pfx|htpasswd)($|\?|\s).*$
            ^<HOST> -.*"(GET|POST|HEAD)\s+\/storage\/.*$

ignoreregex =

# Archive extensions: .tar .gz .bz2 .xz .zip .rar .7z
# Database dumps:    .sql .dump .sqlite .db
# Backup files:      .backup .old .bak
# Config leaks:      .env .config .conf
# TLS/keys:          .pem .key .crt .cer .p12 .pfx .htpasswd
# Storage paths:     /storage/ anything