# Repository Owner Mapping
# Maps development repo names to the agent who maintains them.
# Used by cortex-doctor --bus-alert to route AGENTS.md reminders.
#
# Add entries for any dev repo where an agent should maintain an AGENTS.md.
# Entries without a matching agent are silently skipped (no bus alert sent).

repos:
  # Moses — orchestrator, owns the cortex infrastructure
  hermes-cortex: moses
  hermes-cortex-private: moses

  # Titus — developer, macOS workstation
  # titus-webapp: titus
  # titus-backend: titus
  # titus-mobile: titus

  # Joseph — web infrastructure
  # joseph-site: joseph
  # joseph-api: joseph

  # Gisu — operations
  # gisu-deploy: gisu

  # Kustos — security
  # kustos-audit: kustos
