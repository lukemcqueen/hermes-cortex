# Skills Manifest — {{PROJECT_NAME}}
#
# Declares which global Hermes skills are relevant to this project.
# Replaces file-copy approach: skills live in ~/.hermes/skills/ (the single
# source of truth), and this manifest tells agents which ones to load and when.
#
# Two sections:
#   always    — loaded at session start, every task
#   on_task   — loaded when agent-flow classifies the task into that type
#
# Task types correspond to agent-flow's 12 patterns:
#   simple-code, enterprise, debug, ui, api, db, data,
#   pipeline, research, writing, review, planning

always:
  - name: change-test-loop
    why: TDD discipline for every code change
  - name: engineering-approach
    why: Project conventions, engineering standards
  - name: save-lesson
    why: Auto-save bug fixes for compound learning
  - name: survey-before-action
    why: Check before creating — prevent redundant work
  - name: dev-plan
    why: Plan mode for multi-step features

on_task:
  debug:
    - name: systematic-debugging
      why: 6-phase root cause analysis
  review:
    - name: code-review
      why: Two-axis review (standards + spec)
    - name: architecture-review
      why: Decision matrices, trade-off analysis
  planning:
    - name: spike
      why: Throwaway experiments before building
  enterprise:
    - name: subagent-driven-development
      why: Parallel subagent task execution
  api:
    - name: test-driven-development
      why: RED-GREEN-REFACTOR for endpoint work
  pipeline:
    - name: git-deployment-workflow
      why: Deploy from bare repos
