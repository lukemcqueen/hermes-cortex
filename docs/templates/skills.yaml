# Skills Manifest — {{PROJECT_NAME}}
#
# Declares which global Hermes skills are relevant to this project.
# Replaces file-copy approach: skills live in ~/.hermes/skills/ (the single
# source of truth), and this manifest tells agents which ones to load and when.
#
# Two sections:
#   always    — loaded at session start, every task
#   on_task   — loaded when agent-flow classifies the task into that type
#
# Task types correspond to agent-flow's 12 patterns:
#   simple-code, enterprise, debug, ui, api, db, data,
#   pipeline, research, writing, review, planning
#
# Canonical 7 (consolidated 2026-08-20):
#   - task-start absorbed session-start-discipline
#   - agent-flow absorbed reasoning-patterns
#   - survey-before-action absorbed cortex-preflight
# The enforcer _REQUIRED_SKILLS and doctor check_skills lists MUST stay in
# sync with this section — any change here is a change to the write-gate.

always:
  - name: task-start
    why: Mandatory first action — bundles complete pre-task sequence (incl. todo restore; absorbed session-start-discipline 2026-08-20)
  - name: agent-flow
    why: Workflow router — classifies task, dispatches pattern + skills (incl. reasoning-patterns table; absorbed reasoning-patterns 2026-08-20)
  - name: reflexion-check
    why: Self-critique before delivering — catch blind spots
  - name: change-checklist
    why: Mandatory pre-ship verification before end_change()
  - name: survey-before-action
    why: Pre-flight resource search + repo-specific pre-flight (absorbed cortex-preflight 2026-08-20)
  - name: agent-contract
    why: Non-negotiable execution rules — honesty, verification, citations
  - name: test-driven-development
    why: Iron Law — no production code without a failing test first. Always-loaded so test-first is structurally first, not an afterthought (Titus 2026-08-20)

on_task:
  debug:
    - name: root-cause-debugging
      why: 6-phase root cause analysis with feedback loop
  review:
    - name: code-review
      why: Two-axis review (standards + spec)
  planning:
    - name: task-decomposition
      why: Break large tasks into verifiable units (INVEST)
    - name: dev-plan
      why: Write actionable markdown plans
  enterprise:
    - name: task-decomposition
      why: Break large features into verifiable slices
    - name: subagent-driven-development
      why: Execute plans via parallel sub-agents
  api:
    - name: api-documentation
      why: OpenAPI specs, schemas, auth docs
  pipeline:
    - name: ci-cd-pipeline
      why: GitHub Actions, caching, deployment patterns
    - name: cortex-deployment-sync
      why: Pull-latest / cortex-update invocation sequence, immutable-file deploy, enforcer bypass forms
