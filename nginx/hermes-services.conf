# Hermes Cortex — nginx Reverse Proxy Configuration
# ===================================================
#
# Template for proxying internal services behind nginx.
#
# Port convention:
#   :13001 → first service
#   :13002 → second service
#   :13003 → third service
#   :13004+ → additional services
#
# Binds to 127.0.0.1 only by default — services are not exposed to the LAN.
# For external access, add SSL certs, uncomment auth_basic, and bind to 0.0.0.0.
# See docs/SECURITY.md for details.
#
# CRITICAL — Single Listener Rule:
#   Each server block must have exactly ONE listen directive.
#   NEVER add "listen 127.0.0.1:PORT;" alongside "listen PORT ssl;" —
#   the plain listener catches TLS handshakes and returns 400.

# ── Rate Limiting Zones ──
limit_req_zone $binary_remote_addr zone=general:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=auth:10m   rate=5r/s;

# ── Connection Limiting ──
limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

# ── Upstream Backends ──

upstream app1_backend {
    server 127.0.0.1:8901;
}

upstream app2_backend {
    server 127.0.0.1:3000;
}

# ── App 1 — port 13001 ──
server {
    listen 127.0.0.1:13001;
    server_name localhost;

    access_log  /usr/local/var/log/nginx/app1-access.log;
    error_log   /usr/local/var/log/nginx/app1-error.log;

    # Connection limit: max 10 concurrent per IP
    limit_conn conn_limit 10;

    location / {
        # General rate limit: 20 req/s, burst 40
        limit_req zone=general burst=40 nodelay;
        # Stricter auth rate limit
        limit_req zone=auth burst=10 nodelay;

        proxy_pass http://app1_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# ── App 2 — port 13002 ──
server {
    listen 127.0.0.1:13002;
    server_name localhost;

    access_log  /usr/local/var/log/nginx/app2-access.log;
    error_log   /usr/local/var/log/nginx/app2-error.log;

    limit_conn conn_limit 10;

    location / {
        limit_req zone=general burst=40 nodelay;
        limit_req zone=auth burst=10 nodelay;

        proxy_pass http://app2_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
    }
}

# ── For SSL-enabled external access, add a server block like: ──
#
# server {
#     listen 13001 ssl;
#     server_name your-domain.com localhost;
#
#     ssl_certificate     /path/to/ssl/your-domain.com/fullchain.pem;
#     ssl_certificate_key /path/to/ssl/your-domain.com/privkey.pem;
#
#     auth_basic "Service Name";
#     auth_basic_user_file /path/to/.htpasswd;
#
#     limit_conn conn_limit 10;
#
#     location / {
#         limit_req zone=general burst=40 nodelay;
#         limit_req zone=auth burst=10 nodelay;
#         proxy_pass http://app1_backend;
#         ...
#     }
# }
