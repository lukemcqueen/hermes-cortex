# Hermes Cortex — nginx Reverse Proxy Configuration
# ===================================================
#
# Proxies internal services to localhost ports:
#   :13001 → Cortex Dashboard (port 8901)
#   :13002 → Langfuse (port 3000)
#
# Binds to 127.0.0.1 only — services are not exposed to the LAN.
# Access via SSH tunnel or localhost. For external access, add
# SSL certs, uncomment auth_basic, and bind to 0.0.0.0 explicitly.
# See docs/SECURITY.md for details.

# ── Upstream Backends ──

upstream cortex_dashboard_backend {
    server 127.0.0.1:8901;
}

upstream langfuse_backend {
    server 127.0.0.1:3000;
}

# ── Cortex Dashboard — port 13001 ──
server {
    listen 127.0.0.1:13001;
    server_name localhost;

    access_log  /usr/local/var/log/nginx/cortex-dashboard-access.log;
    error_log   /usr/local/var/log/nginx/cortex-dashboard-error.log;

    location / {
        proxy_pass http://cortex_dashboard_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# ── Langfuse — port 13002 ──
server {
    listen 127.0.0.1:13002;
    server_name localhost;

    access_log  /usr/local/var/log/nginx/langfuse-access.log;
    error_log   /usr/local/var/log/nginx/langfuse-error.log;

    location / {
        proxy_pass http://langfuse_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
    }
}
