# Hermes Cortex — nginx Reverse Proxy Configuration
# ===================================================
#
# Proxies external ports to internal services:
#   :13002 → Langfuse (port 3000)
#   :13001 → Cortex Dashboard (port 8901)
#
# Customize the ports and domain below for your setup.
# Replace example.com with your domain, or use localhost for local-only.
#
# Certificates: generate self-signed or use Let's Encrypt:
#   brew install certbot
#   sudo certbot certonly --nginx -d your-domain.com

# ── Upstream Backends ──

upstream cortex_dashboard_backend {
    server 127.0.0.1:8901;
}

upstream langfuse_backend {
    server 127.0.0.1:3000;
}

# ── Cortex Dashboard — port 13001 ──
server {
    listen 13001 ssl;
    server_name example.com;

    ssl_certificate     /usr/local/etc/nginx/ssl/example.com/fullchain.pem;
    ssl_certificate_key /usr/local/etc/nginx/ssl/example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    access_log  /usr/local/var/log/nginx/cortex-dashboard-access.log;
    error_log   /usr/local/var/log/nginx/cortex-dashboard-error.log;

    error_page 497 =301 https://$host:13001$request_uri;

    auth_basic "Hermes Cortex Dashboard";
    auth_basic_user_file /usr/local/etc/nginx/.htpasswd;

    location / {
        proxy_pass http://cortex_dashboard_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# ── Langfuse — port 13002 ──
server {
    listen 13002 ssl;
    server_name example.com;

    ssl_certificate     /usr/local/etc/nginx/ssl/example.com/fullchain.pem;
    ssl_certificate_key /usr/local/etc/nginx/ssl/example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    access_log  /usr/local/var/log/nginx/langfuse-access.log;
    error_log   /usr/local/var/log/nginx/langfuse-error.log;

    error_page 497 =301 https://$host:13002$request_uri;

    auth_basic "Hermes Langfuse";
    auth_basic_user_file /usr/local/etc/nginx/.htpasswd;

    location / {
        proxy_pass http://langfuse_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
    }
}
