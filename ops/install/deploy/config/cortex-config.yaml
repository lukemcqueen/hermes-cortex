# Hermes Cortex Configuration
# Copy to ~/.hermes-cortex/config.yaml and edit.

# ── Disk Access Sandbox ──────────────────────────────────────
# Control which filesystem paths Hermes agents may access.
#
#   folder_access:
#     level: full              # "full" (default) — unrestricted access
#     # level: specific        # restrict to allowed_paths (recursive)
#     # allowed_paths:         # required when level=specific — one or more folders
#     #   - ~/projects
#     #   - ~/work

folder_access:
  level: full
