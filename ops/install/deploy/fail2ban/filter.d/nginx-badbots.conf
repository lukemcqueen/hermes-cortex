# ─────────────────────────────────────────────────────────────────────────
# FAIL2BAN FILTER — NOT an nginx config. Do NOT include this file in nginx
# (it lives here, not in deploy/nginx/, precisely so nginx.conf globs and
# nginx -t test harnesses never pick it up). Deployed to
# /etc/fail2ban/filter.d/nginx-badbots.conf by install-nginx-full.sh.
#
# Class fix 2026-09-28 (root-caused, not a one-off ban):
#   * URL-encoded-dot (%2e/%2E) secret-file probes — scanners URL-encode the
#     dot to evade literal ".env" rules.  e.g. GET /%2eenv, /%2Eenv
#     NOTE: %% here is configparser interpolation escape for a literal %, so
#     the regex matches "%2e"/"%2E".
#   * Loose literal-dot secret-file rules (.git/config, .env, .pem, ...) and
#     bare secret filenames (/settings.yaml, /config.json).
#   * Archive/backup-download probes (.zip/.rar/.tar*/.7z/.zst/.sql*).
#     Bare .gz/.bz2 are INTENTIONALLY excluded — they false-positive on legit
#     gzipped static assets (/app.js.gz) and would 24h-ban a real visitor at
#     maxretry=1.  Only tar.gz/sql.gz forms (true backup signatures) remain.
#   * /storage/ 404 scanning and phpinfo probes.
#   * AVOIDS the \[[^]]+\] date-bracket form — it silently fails to compile
#     in fail2ban (Python "nested set" warning) and matches NOTHING, so all
#     rules written in that form were dead (extended archive + /storage rules
#     previously shipped in this file and never fired).  Keep everything in
#     the loose "^<HOST> -.*" idiom which fail2ban actually compiles.
# ─────────────────────────────────────────────────────────────────────────
[Definition]

failregex = ^<HOST> -.*"GET\s+/\S*%%(?:2e|2E)(?:env|pem|ssh|git|htaccess|bash_history|dockerenv|env\.pw|supervisor|config|sql|zip|tar|gz|log|key|json|ya?ml|yml|txt|ini|conf)\s*(?:HTTP|\?)
            ^<HOST> -.*"GET\s+/\S*(?:\.git/config|\.env(?:\.local)?|\.(?:pem|ssh|htaccess|bash_history|dockerenv)|settings\.ya?ml|config\.json)\s*(?:HTTP|\?)
            ^<HOST> -.*"GET\s+/\S*\.(?:zip|rar|tar(?:\.gz)?|tar\.bz2|tar\.xz|7z|zst|sql|sql\.gz|sql\.bz2)\s*(?:HTTP|\?)
            ^<HOST> -.*"GET\s+/storage/\S+\s+HTTP\/[0-9.]+"\s+404
            ^<HOST> -.*"GET\s+/\S*phpinfo\S*\s+HTTP\/[0-9.]+

ignoreregex =

[Init]
