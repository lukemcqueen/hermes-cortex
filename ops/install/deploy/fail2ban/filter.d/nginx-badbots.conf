# ─────────────────────────────────────────────────────────────────────────
# FAIL2BAN FILTER — NOT an nginx config. Do NOT include this file in nginx
# (it lives here, not in deploy/nginx/, precisely so nginx.conf globs and
# nginx -t test harnesses never pick it up). Deployed to
# /etc/fail2ban/filter.d/nginx-badbots.conf by install-nginx-full.sh.
#
# Detection (all in the loose "^<HOST> -.*" idiom; fail2ban compiles this).
#   1. Generic bad bots / crawlers / scanners (UA + UA-list based) —
#      preserved from the original filter, NOT dropped.
#   2. URL-encoded-dot secret-file probes — scanners URL-encode the dot to
#      evade literal ".env" rules.  e.g. GET /%2eenv, /%2Eenv
#      NOTE: %% is the configparser interpolation escape for a literal %,
#      so the regex matches "%2e"/"%2E".
#   3. Literal secret-file probes (.git/config, .env, .pem, .ssh) and bare
#      secret filenames (/settings.yaml, /config.json).
#   4. Archive/backup-download probes (.zip/.rar/.tar*/.7z/.zst/.sql*).
#      Bare .gz/.bz2 are INTENTIONALLY excluded — they false-positive on
#      legit gzipped static assets (/app.js.gz) and would 24h-ban a real
#      visitor at maxretry=1.  Only tar.gz/sql.gz forms (true backup
#      signatures) remain.
#   Class fix 2026-09-28: /storage/ 404 scanning + phpinfo probes added;
#   the prior \[[^]]+\] date-bracket form silently failed to compile in
#   fail2ban (Python "nested set" warning) and matched NOTHING — the
#   archive + /storage rules shipped in that form never fired.
# ─────────────────────────────────────────────────────────────────────────
[Definition]

failregex = ^<HOST> -.*"(GET|POST|HEAD|PUT|DELETE|OPTIONS).*"(?:[1-5]\d\d) .*"(?:Mozilla.*(?:BOT|bot|spider|crawl|curl|wget|scrapy|python-requests|Go-http-client)|curl|wget|Scrapy|python-requests|Go-http-client).*"$
            ^<HOST> -.*"(GET|POST|HEAD|PUT|DELETE|OPTIONS).*"(?:[1-5]\d\d) .*"(?:${_badbotscustom})"$
            ^<HOST> -.*"GET\s+/\S*%%(?:2e|2E)(?:env|pem|ssh|git|htaccess|bash_history|dockerenv|env\.pw|supervisor|config|sql|zip|tar|gz|log|key|json|ya?ml|yml|txt|ini|conf)\s*(?:HTTP|\?)
            ^<HOST> -.*"GET\s+/\S*(?:\.git/config|\.env(?:\.local)?|\.(?:pem|ssh|htaccess|bash_history|dockerenv)|settings\.ya?ml|config\.json)\s*(?:HTTP|\?)
            ^<HOST> -.*"GET\s+/\S*\.(?:zip|rar|tar(?:\.gz)?|tar\.bz2|tar\.xz|7z|zst|sql|sql\.gz|sql\.bz2)\s*(?:HTTP|\?)
            ^<HOST> -.*"GET\s+/storage/\S+\s+HTTP\/[0-9.]+"\s+404
            ^<HOST> -.*"GET\s+/\S*phpinfo\S*\s+HTTP\/[0-9.]+

ignoreregex =

[Init]

# Classic bad-bot UA list (fleet-consistent across install-fail2ban.sh)
_badbotscustom = 12345|Badbot|Baiduspider|Curl|Go-http-client|libwww-perl|Lwp-trivial|MJ12bot|python-requests|Scrapy|Wget|YandexBot
