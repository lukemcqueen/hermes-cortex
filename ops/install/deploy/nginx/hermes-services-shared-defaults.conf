# Hermes Cortex — Services Shared Defaults (http block level)
# ============================================================
#
# Consolidates duplicated settings from hermes-services.conf into nginx's
# http block. Auto-included via nginx.conf's "include /etc/nginx/conf.d/*.conf".
#
# Placeholders (__SSL_CERT__, __SSL_CERT_KEY__) substituted at deploy time
# by install-nginx-full.sh and hermes-services-apply.py, same as the
# main template.
#
# Server blocks may override any of these — see hermes-services.conf
# for per-service exceptions (health timeouts, bus auth headers, etc.).
#
# IMPORTANT — add_header inheritance:
#   nginx ONLY inherits add_header from http→server when the server block
#   has ZERO add_header directives of its own. Since we removed all
#   add_header from every server block in hermes-services.conf, these
#   security headers apply to every Hermes service. If you add add_header
#   to a server block, you must repeat ALL of these in that block.
#
# IMPORTANT — if / location NOT valid in http block:
#   Directives that require server/location context (if, location) live
#   inside each server block of hermes-services.conf, not here.

# ── SSL ──
# NOTE (2026-08-05): ssl_certificate/key are NO LONGER defined at http-block
# level. Each server block in hermes-services.conf / orch-hermes-services.conf
# declares its own (Joseph's proposal) so hosts with other nginx configs
# (luke-server) never inherit the hermes cert as a global default. The
# shared session cache stays here — it is just a cache, not a cert binding.
ssl_session_cache   shared:SSL:10m;
ssl_session_timeout 10m;

# ── Request size & timeouts (override per-server as needed) ──
client_max_body_size 10m;
client_body_timeout 30s;
client_header_timeout 30s;
send_timeout 30s;
keepalive_timeout 65s;

# ── Proxy defaults ──
proxy_http_version 1.1;
proxy_hide_header Server;

proxy_set_header Upgrade $http_upgrade;
proxy_set_header Connection "upgrade";
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;

# ── Connection limits ──
# 10 -> 50 (2026-08-08): one modern browser holds 6-8 connections; two tabs
# = ~16. 50 still catches connection floods (DDoS = 100s+ conns per IP).
limit_conn conn_limit 50;

# ── Security headers (inherited by all server blocks) ──
add_header X-Content-Type-Options    "nosniff" always;
add_header X-Frame-Options           "DENY" always;
add_header X-XSS-Protection          "0" always;
add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
add_header Permissions-Policy        "camera=(), microphone=(), geolocation=()" always;
add_header Content-Security-Policy   $csp_header always;
add_header Cache-Control             "no-store, max-age=0" always;
add_header Server                    "Hermes" always;
