# Hermes Cortex — nginx Reverse Proxy Configuration
# ===================================================
#
# Core services (every agent):
#   xx001 → Cortex Dashboard (8901)
#   xx002 → Langfuse (3000)
#   xx007 → Health, NO AUTH (8905)
#
# Extra services (per-agent opt-in via HERMES_SERVICES; deployed to
# conf.d/ — auto-included by nginx.conf's "include conf.d/*.conf"):
#   xx003 → Grafana, xx004 → Agent Bus, xx005 → Push Metrics
#   See orch-hermes-services.conf
#
# http-block defaults (SSL, timeouts, security headers, proxy defaults)
# live in hermes-services-shared-defaults.conf (conf.d/*.conf).
#
# Port prefix (auto-preserved by deploy scripts):
#   13 = generic, 12 = Joseph, 14 = Esther
#
# Placeholders:
#   __NGINX_LOG_DIR__     → OS-aware nginx log path
#   __HTPASSWD_FILE__      → htpasswd file path
#   __NGINX_CONFIG_DIR__   → nginx config directory (OS-aware)

# ── Upstream Backends (core) ──
upstream cortex_dashboard_backend {
    server 127.0.0.1:8901;
}

upstream langfuse_backend {
    server 127.0.0.1:3000;
}

upstream health_backend {
    keepalive 32;
    server 127.0.0.1:8905;
}

# ── App 1 — port xx001 (Cortex Dashboard) ──
server {
    listen 13001 ssl;
    server_name localhost;

    # Explicit per-block cert (Joseph 2026-08-05): isolates this app's
    # certificate from the http-block default so hosts with OTHER nginx
    # configs (luke-server) never inherit the hermes cert. Placeholders
    # resolve per-host at deploy (apply.py substitutes every occurrence).
    ssl_certificate     __SSL_CERT__;
    ssl_certificate_key __SSL_CERT_KEY__;

    auth_basic "App 1";
    auth_basic_user_file __HTPASSWD_FILE__;

    if ($block_direct_ip) { return 444; }

    access_log  __NGINX_LOG_DIR__/app1-access.log;
    error_log   __NGINX_LOG_DIR__/app1-error.log;

    location ~ /\.(git|env|svn|hg|idea|vscode|DS_Store|htpasswd) {
        deny all;
        return 404;
    }

    location / {
        limit_req zone=general burst=40 nodelay;
        limit_req zone=auth burst=10 nodelay;
        proxy_pass http://cortex_dashboard_backend;
    }
}

# ── App 2 — port xx002 (Langfuse) ──
server {
    listen 13002 ssl;
    server_name localhost;

    # Explicit per-block cert (Joseph 2026-08-05): isolates this app's
    # certificate from the http-block default so hosts with OTHER nginx
    # configs (luke-server) never inherit the hermes cert. Placeholders
    # resolve per-host at deploy (apply.py substitutes every occurrence).
    ssl_certificate     __SSL_CERT__;
    ssl_certificate_key __SSL_CERT_KEY__;

    auth_basic "App 2";
    auth_basic_user_file __HTPASSWD_FILE__;

    if ($block_direct_ip) { return 444; }

    access_log  __NGINX_LOG_DIR__/app2-access.log;
    error_log   __NGINX_LOG_DIR__/app2-error.log;

    location ~ /\.(git|env|svn|hg|idea|vscode|DS_Store|htpasswd) {
        deny all;
        return 404;
    }

    location / {
        limit_req zone=general burst=40 nodelay;
        proxy_pass http://langfuse_backend;
        proxy_read_timeout 86400s;
    }
}

# ── App 7 — port xx007 (Health) — NO AUTH ──
server {
    listen 13007 ssl;
    server_name localhost;

    # Explicit per-block cert (Joseph 2026-08-05): isolates this app's
    # certificate from the http-block default so hosts with OTHER nginx
    # configs (luke-server) never inherit the hermes cert. Placeholders
    # resolve per-host at deploy (apply.py substitutes every occurrence).
    ssl_certificate     __SSL_CERT__;
    ssl_certificate_key __SSL_CERT_KEY__;

    client_max_body_size 1m;
    client_body_timeout 10s;
    client_header_timeout 10s;
    send_timeout 10s;
    keepalive_timeout 30s;

    if ($block_direct_ip) { return 444; }

    access_log  __NGINX_LOG_DIR__/health-access.log;
    error_log   __NGINX_LOG_DIR__/health-error.log;

    location ~ /\.(git|env|svn|hg|idea|vscode|DS_Store|htpasswd) {
        deny all;
        return 404;
    }

    location / {
        limit_req zone=general burst=10 nodelay;
        proxy_pass http://health_backend;
        proxy_set_header Connection "";
    }
}

# ── Extra services ──
# Opt-in extras (grafana, bus, metrics) and http-block defaults are
# deployed to conf.d/ and auto-included via nginx.conf's
# "include conf.d/*.conf" — no explicit include needed here.
# (Linux Debian/Ubuntu and macOS Homebrew nginx.conf both include
# conf.d/*.conf in the http block.)
