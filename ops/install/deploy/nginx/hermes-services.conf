# ── Health Server — port xx007 (all agents) — NO AUTH ──
server {
    listen 13007 ssl;
    server_name localhost;

    ssl_certificate     __SSL_CERT__;
    ssl_certificate_key __SSL_CERT_KEY__;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    client_max_body_size 1m;
    client_body_timeout 10s;
    client_header_timeout 10s;
    send_timeout 10s;
    keepalive_timeout 30s;

    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "DENY" always;
    add_header Cache-Control             "no-store, max-age=0" always;
    proxy_hide_header Server;
    add_header Server "Hermes" always;

    if ($block_direct_ip) {
        return 444;
    }

    access_log  __NGINX_LOG_DIR__/health-access.log;
    error_log   __NGINX_LOG_DIR__/health-error.log;

    limit_conn conn_limit 10;

    location / {
        limit_req zone=general burst=10 nodelay;
        proxy_pass http://health_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
