# CRITICAL — Single Listener Rule:
#   Each server block must have exactly ONE listen directive.
#   NEVER add "listen 127.0.0.1:PORT;" alongside "listen PORT ssl;" —
#   the plain listener catches TLS handshakes and returns 400.

# ── Port convention:
#   :xx001 → Cortex Dashboard
#   :xx002 → Langfuse
#   :xx003 → Agent Bus (replaces legacy Agent Inbox)
#   :xx004 → (available)
#   :xx007 → Health (NO AUTH — Moses polls this)

# ── Upstream Backends ──
upstream cortex_dashboard_backend {
    server 127.0.0.1:8901;
}
upstream langfuse_backend {
    server 127.0.0.1:3000;
}
upstream agent_bus_backend {
    server 127.0.0.1:8903;
}
upstream health_backend {
    server 127.0.0.1:8905;
}

# ── Backup Bus (Esther) ──
upstream esther_bus_backend {
    server 127.0.0.1:8903;
}

# ── Included configs ──
include __NGINX_BREW_DIR__/allow-ips-manual.conf;

# ── Zone definitions & maps (rate limiting, CSP, direct-IP blocker) ──
include __NGINX_BREW_DIR__/hermes-zone-defs.conf;
include __NGINX_BREW_DIR__/blocked_ips.conf;

# ── HTTP → HTTPS redirect ──
server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

# ── Main HTTPS server block ──
server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate __SSL_CERT__;
    ssl_certificate_key __SSL_CERT_KEY__;

    # ── Auth ──
    auth_basic "Hermes Cortex";
    auth_basic_user_file __HTPASSWD_FILE__;

    # ── Security headers ──
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options DENY;
    add_header X-XSS-Protection "1; mode=block";

    # ── Dashboard ──
    location / {
        proxy_pass http://cortex_dashboard_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Langfuse ──
    location /langfuse/ {
        proxy_pass http://langfuse_backend/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Agent Bus ──
    location /bus/ {
        proxy_pass http://agent_bus_backend/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Agent Bus API ──
    location /api/ {
        proxy_pass http://agent_bus_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Well-known for agent cards ──
    location /.well-known/ {
        proxy_pass http://agent_bus_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Health (no auth — Moses/Esther poll this) ──
    location /health {
        auth_basic off;
        proxy_pass http://health_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Pings (no auth) ──
    location = /ping {
        auth_basic off;
        return 200 "pong";
    }
}
