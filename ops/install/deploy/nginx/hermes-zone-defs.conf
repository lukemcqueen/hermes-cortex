# Hermes Cortex — nginx Zone Definitions & Maps
# ===============================================
#
# Included by hermes-services.conf. These live in a separate file so the
# template doesn't duplicate zones already in nginx.conf (which causes
# "already bound" errors). Fresh installs: place this alongside the main
# config and include it from hermes-services.conf or nginx.conf.
#
# OS-aware deployment: install-nginx.sh and cortex-update.sh copy this file
# alongside hermes-services.conf. Paths are resolved at deploy time using
# OS detection (see os-config.sh for the NGINX_CONFIG_DIR logic).

# ── Rate Limiting Zones ──
# Trusted fleet IPs bypass the DDoS ceilings entirely: an EMPTY key
# ($limit_bypass="") makes nginx apply NO limit, so the fleet's probes never
# 503/499 at their :00/:30 ticks. Everyone else stays keyed by source IP and
# keeps the tight ceiling. Add a worker/agent IP here when it joins off-LAN.
geo $limit_bypass {
    default          $binary_remote_addr;
    192.168.1.0/24   "";     # LAN fleet (router NAT aggregate)
    115.21.71.146    "";     # external WAN worker
    127.0.0.0/8      "";     # localhost
}
limit_req_zone  $limit_bypass zone=general:10m rate=20r/s;
limit_req_zone  $limit_bypass zone=auth:10m   rate=5r/s;

# ── Connection Limiting ──
limit_conn_zone $limit_bypass zone=conn_limit:10m;

# ── WebSocket Connection Upgrade Map ──
# Enables upstream keepalive for regular HTTP while preserving
# Connection: upgrade for WebSocket upgrade requests.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      "";
}

# ── CSP Fallback Map ──
# Provides a strict CSP when the upstream doesn't send one.
map $upstream_http_content_security_policy $csp_header {
    default "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'";
    ~.     $upstream_http_content_security_policy;
}

# ── Direct-IP Blocker Map ──
# Returns 1 when Host is a bare IP that isn't localhost or 127.x.x.x.
map $host $block_direct_ip {
    default     0;
    "~*^127\."      0;
    "~*^localhost$" 0;
    "~^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$" 1;
}
