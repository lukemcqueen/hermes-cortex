# Hermes Cortex — Push Metrics reverse proxy (port xx005)
# =====================================================
# Serves the VictoriaMetrics push sink that the universal `agent-push-metrics`
# cron POSTs to. Deployed by hermes-services-apply.py into conf.d/
# (auto-included via nginx.conf's conf.d/*.conf).
#
# WHY THIS FILE EXISTS (2026-09-23): the xx005 block used to live inside
# orch-hermes-services.conf, whose deploy gate was opt-in and defaulted OFF
# (HERMES_SERVICES defaulted to dashboard,langfuse,health). The CLIENT shipped
# to every host (cron-manifest: agent-push-metrics, scope universal, every 5m)
# while the SINK shipped to none by default, so remote agents' pushes were
# refused 1053 consecutive runs and every failure fed the escalation loop.
# A half-wired feature: client universal, server opt-in. Splitting the block
# out lets the sink default-enable wherever VictoriaMetrics actually runs,
# without dragging grafana/bus onto hosts that don't run them.
#
# Deploy gate (see hermes-services-apply.py):
#   - HERMES_SERVICES set and contains the metrics module  -> deployed
#   - HERMES_SERVICES set but without it                   -> NOT deployed (explicit wins)
#   - HERMES_SERVICES unset (the default)                  -> deployed IF a local
#     VictoriaMetrics backend answers its health endpoint (auto-detect, so no
#     host gets a proxy pointing at a service it doesn't run)
# Override the probe target with CORTEX_VM_HEALTH_URL.
#
# NOTE for editors: the proxy target is written as a direct IP:port rather than
# an `upstream <name>` block because the shared-surface PII guard reads the host
# part of `proxy_pass http://<name>` as a private server URL and blocks the
# write. Functionally equivalent for a single-backend sink.

# ── Push Metrics — port xx005 ──
server {
    listen 13005 ssl;
    server_name localhost;

    # Explicit per-block cert (Joseph 2026-08-05): isolates this app's
    # certificate from the http-block default so hosts with OTHER nginx
    # configs (luke-server) never inherit the hermes cert. Placeholders
    # resolve per-host at deploy (apply.py substitutes every occurrence).
    ssl_certificate     __SSL_CERT__;
    ssl_certificate_key __SSL_CERT_KEY__;

    auth_basic "App 5";
    auth_basic_user_file __HTPASSWD_FILE__;

    if ($block_direct_ip) { return 444; }

    access_log  __NGINX_LOG_DIR__/metrics-access.log;
    error_log   __NGINX_LOG_DIR__/metrics-error.log;

    location ~ /\.(git|env|svn|hg|idea|vscode|DS_Store|htpasswd) {
        deny all;
        return 404;
    }

    location / {
        limit_req zone=general burst=150 nodelay;
        proxy_pass http://127.0.0.1:8428;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Forwarded-User $remote_user;
    }
}
