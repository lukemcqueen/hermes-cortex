# Hermes Cortex — Extra Services (port xx003, xx004, xx005)
# ===========================================================
# Optional services enabled per-agent via HERMES_SERVICES env var.
# Deployed to conf.d/ (auto-included via nginx.conf's conf.d/*.conf)
# only when the agent opts in via HERMES_SERVICES.
#
# Contains: Grafana (xx003), Agent Bus (xx004), Push Metrics (xx005)

# ── Grafana — port xx003 ──
upstream grafana_backend {
    keepalive 32;
    server 127.0.0.1:3030;
}

server {
    listen 13003 ssl;
    server_name localhost;

    # Explicit per-block cert (Joseph 2026-08-05): isolates this app's
    # certificate from the http-block default so hosts with OTHER nginx
    # configs (luke-server) never inherit the hermes cert. Placeholders
    # resolve per-host at deploy (apply.py substitutes every occurrence).
    ssl_certificate     __SSL_CERT__;
    ssl_certificate_key __SSL_CERT_KEY__;

    auth_basic "App 3";
    auth_basic_user_file __HTPASSWD_FILE__;

    if ($block_direct_ip) { return 444; }

    access_log  __NGINX_LOG_DIR__/grafana-access.log;
    error_log   __NGINX_LOG_DIR__/grafana-error.log;

    location ~ /\.(git|env|svn|hg|idea|vscode|DS_Store|htpasswd) {
        deny all;
        return 404;
    }

    location / {
        limit_req zone=general burst=150 nodelay;
        proxy_pass http://grafana_backend;
        proxy_read_timeout 86400s;
    }
}

# ── Agent Bus — port xx004 ──
# Not all agents host a local bus — some connect externally (see SOUL.md).
upstream cortex_bus_backend {
    server 127.0.0.1:8903;
}

server {
    listen 13004 ssl;
    server_name localhost;

    # Explicit per-block cert (Joseph 2026-08-05): isolates this app's
    # certificate from the http-block default so hosts with OTHER nginx
    # configs (luke-server) never inherit the hermes cert. Placeholders
    # resolve per-host at deploy (apply.py substitutes every occurrence).
    ssl_certificate     __SSL_CERT__;
    ssl_certificate_key __SSL_CERT_KEY__;

    auth_basic "App 4";
    auth_basic_user_file __HTPASSWD_FILE__;

    if ($block_direct_ip) { return 444; }

    access_log  __NGINX_LOG_DIR__/cortex-bus-access.log;
    error_log   __NGINX_LOG_DIR__/cortex-bus-error.log;

    location ~ /\.(git|env|svn|hg|idea|vscode|DS_Store|htpasswd) {
        deny all;
        return 404;
    }

    location / {
        limit_req zone=general burst=150 nodelay;
        proxy_pass http://cortex_bus_backend;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Forwarded-User $remote_user;
    }
}

