# Add this server block to /etc/nginx/sites-available/hermes-services.conf
# before the "# ── Health Server — port xx007" section.
# Then: sudo nginx -t && sudo systemctl reload nginx
# And add port forwarding on router: 13003 → 192.168.1.44:13003

# ── App 6 — VictoriaMetrics UI — port 13003 (vmui / query browser) ──
server {
    listen 13003 ssl;
    server_name localhost;

    ssl_certificate     /etc/letsencrypt/live/bus.example.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bus.example.org/privkey.pem;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    auth_basic "App 6";
    auth_basic_user_file /etc/nginx/.hermes-htpasswd;

    client_max_body_size 10m;
    client_body_timeout 30s;
    client_header_timeout 30s;
    send_timeout 30s;
    keepalive_timeout 65s;

    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "DENY" always;
    add_header Cache-Control             "no-store, max-age=0" always;
    proxy_hide_header Server;
    add_header Server "Hermes" always;

    if ($block_direct_ip) {
        return 444;
    }

    access_log  /var/log/nginx/victoria-metrics-ui-access.log;
    error_log   /var/log/nginx/victoria-metrics-ui-error.log;

    location / {
        limit_req zone=general burst=20 nodelay;
        proxy_pass http://metrics_backend;
        proxy_set_header Authorization $http_authorization;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
