# ops/install/harnesses/registry.yaml
#
# THE SINGLE SOURCE for coding-agent harness integration.
#
# Everything else in this tree is DERIVED: a harness's README, its shim script
# and its verify steps are generated from the entry below, so adding harness
# #37 is one entry plus `generate-harnesses.py` — never a hand-written bespoke
# shim. That is ADR-0005's rule ("ONE standard shim, generated per agent, never
# hand-written bespoke per agent") applied to context integration.
#
#   generate-harnesses.py --check     # CI/doctor: is every derived file current?
#   generate-harnesses.py --report    # coverage: declared vs actually wired
#
# WHY A REGISTRY, NOT PER-HARNESS DIRECTORIES OF PROSE: with ~100 harnesses the
# failure mode is not "no docs", it is "100 docs that disagree". A registry makes
# disagreement impossible — there is one place a harness's layer is stated.
#
# layer:
#   mcp            harness reads an MCP server from its own config
#   cli-extension  harness has NO MCP client; it needs an extension/shim that
#                  shells out to the shared CLI (Pi is the canonical example)
#   cli-hook       harness only needs a lifecycle command run at a boundary
#   none           declared as unsupported, with the reason — so the gap is
#                  visible instead of silently absent
version: 1

defaults:
  # Every non-MCP harness goes through this one CLI (never a bespoke script).
  cli: cortex-context
  cli_path: ~/.hermes-cortex/scripts/cortex-context.py
  mcp_server: ~/hermes-cortex/mcp-servers/cortex-context-mcp.py
  # The trigger half: the harness owns WHEN a checkpoint is written.
  trigger: ~/.hermes-cortex/scripts/session-autocheckpoint.py
  impl: ops/services/mycortex-mem/context_tools.py
  env:
    - CORTEX_SESSION_HARNESS
    - CORTEX_SESSION_REPO
    - CORTEX_SESSION_BRANCH
  # macOS: the interpreter may not be on Pi's PATH (Homebrew python lives at
  # /opt/homebrew/bin on Apple Silicon, /usr/local/bin on Intel) — override it.
  env_optional:
    - CORTEX_CONTEXT_CLI
    - CORTEX_CONTEXT_PYTHON

harnesses:
  - name: pi
    layer: cli-extension
    status: shipped
    surface: 'pi.on("turn_end"|"before_agent_start"|"session_before_compact") + pi.registerTool'
    why: |
      Pi has NO MCP client at the CONTEXT layer: its memory/session surface is
      hooks + registered tools in TypeScript, so it reaches the shared CLI
      through the extension below. (Governance is a separate capability — see
      `capabilities.governance`, which is MCP for Pi >= 0.99 and the git hooks
      plus the loop-gov CLI otherwise. On the shipped Pi 0.87.1 there is NO MCP client, so the VERIFIED route is the git hooks — core.hooksPath is global, so a Pi commit is gated exactly like a Hermes one — plus loop-gov.py, which exposes the whole governance toolset (begin_change, end_change, check_lock, cycle_query, feedback_accept/override) over the ONE MCP implementation; see capabilities.governance.fallback for the three checks. Do NOT conclude governance is unavailable because MCP is: memory, skills and governance are all reachable on this Pi today.)
    artifact: extensions/cortex-context.ts
    triggers:
      turn_end: checkpoint (the trigger — MCP cannot provide this)
      before_agent_start: restore + inject the checkpoint
      session_before_compact: checkpoint before continuity is lost
    install: |
      # USER SCOPE — every Pi project, one registration (recommended):
      bash ~/hermes-cortex/ops/scripts/install/install-pi-integration.sh
      # PROJECT SCOPE — one repo, files copied in + a generated run line:
      hc harness install pi --dir <your-pi-project>
      # (equivalent, manual: mkdir -p extensions && cp <harnesses>/pi/extensions/cortex-context.ts extensions/)
    install_ops:
      - mkdir: extensions
      - copy:
          from: pi/extensions/cortex-context.ts
          to: extensions/cortex-context.ts
    # A capability is what a harness must be wired to; the layer above is only
    # its CONTEXT half. Declaring skills/governance here is the difference
    # between "registered somewhere" and "registered the same way" — each names
    # the one script that registers it and how to prove it landed.
    capabilities:
      context:
        adapter: cli-extension
        register: ops/scripts/install/install-pi-integration.sh
        verify:
          - 'In a Pi session call mem_context — the peer card must come back.'
      skills:
        adapter: discovery
        register: ops/scripts/install/install-pi-integration.sh
        from: skills.yaml#always
        why: |
          Pi advertises each skill's NAME + DESCRIPTION at startup and loads the
          body on demand, so it must be pointed at a CURATED set — wiring the
          whole ~400-skill library in is a self-inflicted context wound. The set
          is DERIVED from the skills manifest's `always:` section (the same one
          definition Hermes loads), and registered at USER scope in
          ~/.pi/agent/settings.json — the same one-file pattern the MCP servers
          already use, instead of re-copying flags per repo.
        verify:
          - 'bash ops/scripts/install/install-pi-integration.sh --check exits 0.'
          - 'Pi shows the always-skills as /skill:<name> commands (startup diagnostics).'
      governance:
        # VERSION-AWARE (2026-10-02). `adapter: mcp` below is the PREFERRED route, but
        # it needs Pi >= 0.99 and the shipped Pi is 0.87.1 — no MCP client. Declaring
        # only that route left an agent on an older Pi with a register command it
        # cannot run and a verify step ("pi mcp list shows…") that fails for a reason
        # unrelated to governance. Both routes reach the SAME implementation: the gates
        # and the governance DB are host state, so a Pi commit is governed identically
        # either way. Do NOT conclude governance is unavailable because MCP is.
        adapter: mcp
        register: ops/scripts/install/install-pi-mcp.sh
        from: loop-gov-mcp.py
        requires: "pi >= 0.99 (MCP client)"
        fallback:
          adapter: cli
          requires: "any Pi version — verified on 0.87.1"
          register: "(none — core.hooksPath is global, and loop-gov.py is deployed with the rest of ops/scripts)"
          from: loop-gov-mcp.py
          why: "A Pi commit runs the SAME gates as a Hermes commit (core.hooksPath is a
            \ global git config, so the hooks are not harness-specific), and
            \ loop-gov.py --list exposes the full governance toolset — begin_change,
            \ end_change, check_lock, cycle_query, feedback_accept/override — as a
            \ generic CLI over the one MCP implementation, so a Pi agent without MCP
            \ can run the entire ritual."
          verify:
          - git config --get core.hooksPath prints ~/.hermes-cortex/hooks — so a commit made from a Pi session is gated.
          - python3 ~/.hermes-cortex/scripts/loop-gov.py --list lists begin_change and end_change.
          - python3 ~/.hermes-cortex/scripts/loop-gov.py check_lock returns a JSON status object (the CLI reaches the governance store). Note: its 'active' field is NOT the test the push gate uses — a lock FILE can exist (and permit a push) while check_lock reports inactive, so an inactive reading must not be taken as permission to push.
          - python3 ~/.hermes-cortex/scripts/loop-gov.py begin_change '{"task_id":"pi-smoke","description":"probe"}' returns a cycle id and end_change releases it — run this only when you hold no other lock.
        why: |
          Pi >= 0.99 gained an MCP client and reads user-scope servers from
          ~/.pi/agent/mcp.json, so the four governance servers (loop-governance,
          tasks, executor, agent-bus) register exactly like Claude Code's — one
          implementation, one way in per harness. On an older Pi with no MCP
          client the commit-time git hooks STILL govern (core.hooksPath is
          global, so a Pi commit runs the same gates as a Hermes one), and
          ops/scripts/loop-gov.py is the CLI way in for the interactive ritual.
        verify:
          - 'pi mcp list shows loop-governance, tasks, executor, agent-bus.'
          - 'A commit made from a Pi session passes the hooks (or names the gate it hit).'
    # Base built-in tools only. The mem_*/session_* half of `--tools` is DERIVED
    # from the contract by `hc harness install pi` (context_tools.TOOLS) — never
    # hand-typed here, because a hand-typed list silently rots when the contract
    # grows a tool and Pi ends up unable to reach it.
    tools_base: [read, bash, edit, write]
    verify:
      - 'In a Pi session call mem_context — the peer card must come back.'
      - 'Let a turn end with a decision, then: cortex-context session_restore "{}" | grep <marker>'
      - 'Start a second session; the checkpoint must appear unasked (Pi logs CORTEX_RESUME).'

  - name: hermes
    layer: mcp
    status: shipped
    surface: 'hermes mcp add'
    why: Hermes reads MCP servers from config, so it needs no shim at all.
    install: |
      hermes mcp add cortex-context \
          --command ~/.hermes/hermes-agent/venv/bin/python3 \
          --args ~/hermes-cortex/mcp-servers/cortex-context-mcp.py
    verify:
      - 'hermes mcp list | grep cortex-context'
      - 'Call mcp__cortex_context__mem_context; the peer card must come back.'
    triggers:
      note: 'Harness side: ops/scripts/session-autocheckpoint.py at a boundary, or a cron.'

  - name: claude-code
    layer: mcp
    status: documented
    surface: '.mcp.json'
    why: MCP-native; registration is a config entry, no shim.
    install: |
      Add to .mcp.json:
        {"mcpServers": {"cortex-context": {"command": "python3",
          "args": ["<mcp_server>"]}}}
    verify:
      - 'claude mcp list  (or /mcp) shows cortex-context'
      - 'Call mem_context; the peer card must come back.'

  - name: codex
    layer: mcp
    status: documented
    surface: '~/.codex/config.toml [mcp_servers]'
    why: MCP-native; registration is a config entry, no shim.
    install: |
      Add to ~/.codex/config.toml:
        [mcp_servers.cortex-context]
        command = "python3"
        args = ["<mcp_server>"]
    verify:
      - 'codex mcp list shows cortex-context'
      - 'Call mem_context; the peer card must come back.'

  - name: steadfaste-tui
    layer: none
    status: blocked
    surface: unknown
    why: |
      Steadfaste's own gateway is not complete, so its harness surface cannot be
      designed against it yet. Declared here with the reason rather than guessed
      at: a wrong layer means a wiring that "exists" and does nothing.
    verify: []
