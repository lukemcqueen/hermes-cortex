# ops/install/harnesses/registry.yaml
#
# THE SINGLE SOURCE for coding-agent harness integration.
#
# Everything else in this tree is DERIVED: a harness's README, its shim script
# and its verify steps are generated from the entry below, so adding harness
# #37 is one entry plus `generate-harnesses.py` — never a hand-written bespoke
# shim. That is ADR-0005's rule ("ONE standard shim, generated per agent, never
# hand-written bespoke per agent") applied to context integration.
#
#   generate-harnesses.py --check     # CI/doctor: is every derived file current?
#   generate-harnesses.py --report    # coverage: declared vs actually wired
#
# WHY A REGISTRY, NOT PER-HARNESS DIRECTORIES OF PROSE: with ~100 harnesses the
# failure mode is not "no docs", it is "100 docs that disagree". A registry makes
# disagreement impossible — there is one place a harness's layer is stated.
#
# layer:
#   mcp            harness reads an MCP server from its own config
#   cli-extension  harness has NO MCP client; it needs an extension/shim that
#                  shells out to the shared CLI (Pi is the canonical example)
#   cli-hook       harness only needs a lifecycle command run at a boundary
#   none           declared as unsupported, with the reason — so the gap is
#                  visible instead of silently absent
version: 1

defaults:
  # Every non-MCP harness goes through this one CLI (never a bespoke script).
  cli: cortex-context
  cli_path: ~/.hermes-cortex/scripts/cortex-context.py
  mcp_server: ~/hermes-cortex/mcp-servers/cortex-context-mcp.py
  # The trigger half: the harness owns WHEN a checkpoint is written.
  trigger: ~/.hermes-cortex/scripts/session-autocheckpoint.py
  impl: ops/services/mycortex-mem/context_tools.py
  env:
    - CORTEX_SESSION_HARNESS
    - CORTEX_SESSION_REPO
    - CORTEX_SESSION_BRANCH
  # macOS: the interpreter may not be on Pi's PATH (Homebrew python lives at
  # /opt/homebrew/bin on Apple Silicon, /usr/local/bin on Intel) — override it.
  env_optional:
    - CORTEX_CONTEXT_CLI
    - CORTEX_CONTEXT_PYTHON

harnesses:
  - name: pi
    layer: mcp
    status: shipped
    # PRESENCE (what the doctor gates on): the harness's own artifact on THIS host.
    # Declared here because the registry is the ONE source of harness knowledge — a
    # second copy in the doctor would go stale the moment a harness is added.
    presence:
      - ~/.pi/agent
    surface: 'MCP (cortex-context) + pi.on("tool_call" write gate | "turn_end" | "before_agent_start" | "session_before_compact")'
    why: |
      Pi 1.0.0 HAS an MCP client (verified on the host with `pi mcp list`, which
      lists the connected servers and their tools), so the memory/session TOOLS
      come from the SAME MCP server Claude Code and Codex use — one
      implementation, schemas DERIVED from the contract, nothing per-harness left
      to drift. The extension is kept for the half MCP CANNOT provide: WHEN a
      checkpoint is written (turn_end / before_agent_start / session_before_compact).

      This entry used to be `cli-extension` for BOTH halves, with the tools
      registered by hand as `{ run: async (input) => … }`. When Pi moved
      0.87.1 → 1.0.0 that shape became invalid and every memory/session call
      failed SILENTLY with "definition.execute is not a function" while the store
      was perfectly healthy. The hand-written parameter maps were also a SECOND
      definition of tools that already existed in the contract. One way in per
      capability, or one of the two becomes a phantom.

      (Governance is a separate capability — see `capabilities.governance`.)
    artifact:
      - extensions/cortex-context.ts
      - extensions/cortex-governance.ts
    triggers:
      turn_end: checkpoint (the trigger — MCP cannot provide this)
      before_agent_start: restore + inject the checkpoint
      session_before_compact: checkpoint before continuity is lost
    install: |
      # USER SCOPE — every Pi project, one registration (recommended):
      bash ~/hermes-cortex/ops/scripts/install/install-pi-mcp.sh          # the TOOLS (MCP)
      bash ~/hermes-cortex/ops/scripts/install/install-pi-integration.sh  # the TRIGGERS + skills
      # PROJECT SCOPE — one repo, files copied in + a generated run line:
      hc harness install pi --dir <your-pi-project>
      # (equivalent, manual: mkdir -p extensions && cp <harnesses>/pi/extensions/cortex-context.ts extensions/)
    install_ops:
      - mkdir: extensions
      - copy:
          from: pi/extensions/cortex-context.ts
          to: extensions/cortex-context.ts
      - copy:
          from: pi/extensions/cortex-governance.ts
          to: extensions/cortex-governance.ts
    # A capability is what a harness must be wired to; the layer above is only
    # its CONTEXT half. Declaring skills/governance here is the difference
    # between "registered somewhere" and "registered the same way" — each names
    # the one script that registers it and how to prove it landed.
    capabilities:
      context:
        adapter: mcp
        register: ops/scripts/install/install-pi-mcp.sh
        from: cortex-context-mcp.py
        requires: "pi >= 0.99 (MCP client) — detected on the host, never assumed from a version in a doc"
        why: |
          The tools are the SHARED server, so Pi is not special: same schemas,
          same semantics, one place to fix. The lifecycle triggers stay in the
          extension because MCP has no lifecycle — a harness that owns "when"
          cannot be replaced by a tool surface.
        verify:
          - 'pi mcp list shows cortex-context with the memory/session tools.'
          - 'In a Pi session call mem_context — the peer card must come back.'
      skills:
        adapter: discovery
        register: ops/scripts/install/install-pi-integration.sh
        from: skills.yaml#always
        why: |
          Pi advertises each skill's NAME + DESCRIPTION at startup and loads the
          body on demand, so it must be pointed at a CURATED set — wiring the
          whole ~400-skill library in is a self-inflicted context wound. The set
          is DERIVED from the skills manifest's `always:` section (the same one
          definition Hermes loads), and registered at USER scope in
          ~/.pi/agent/settings.json — the same one-file pattern the MCP servers
          already use, instead of re-copying flags per repo.
        verify:
          - 'bash ops/scripts/install/install-pi-integration.sh --check exits 0.'
          - 'Pi shows the always-skills as /skill:<name> commands (startup diagnostics).'
          - 'cortex-update.sh runs the installer on any host where Pi is present (~/.pi/agent), and the doctor reports it as `Pi integration` (PASS / WARN / absent). Verification evidence lives in docs/evidence/, not here.'
      governance:
        # VERSION-AWARE (2026-10-02). `adapter: mcp` below is the PREFERRED route, but
        # it needs an MCP-capable Pi — detected from the CLI's own help, not assumed: on Pi 0.87.1 the CLI exposed no
        # 'mcp' subcommand (pi --help has ZERO matches for mcp) and there is no
        # ~/.pi/agent/mcp.json. Do NOT infer this from 'pi mcp list' — that command
        # errors on authentication BEFORE it can report MCP status, so an auth failure
        # is not evidence about MCP availability (a probe that never ran is not a
        # negative result). Declaring only the MCP route left an agent on an older Pi
        # with a register command it cannot run and a verify step ("pi mcp list shows…")
        # that fails for a reason unrelated to governance — and would reasonably
        # conclude governance is unavailable. Both routes reach the SAME
        # implementation: the gates and the governance DB are host state, so a Pi
        # commit is governed identically either way.
        adapter: mcp
        register: ops/scripts/install/install-pi-mcp.sh
        from: loop-gov-mcp.py
        requires: "pi >= 0.99 (MCP client)"
        fallback:
          adapter: cli
          requires: "any Pi version — the installed version is detected on the host, not assumed"
          register: "(none — core.hooksPath is global, and loop-gov.py is deployed with the rest of ops/scripts)"
          from: loop-gov-mcp.py
          why: "A Pi commit runs the SAME gates as a Hermes commit (core.hooksPath is a
            \ global git config, so the hooks are not harness-specific), and
            \ loop-gov.py --list exposes the full governance toolset — begin_change,
            \ end_change, check_lock, cycle_query, feedback_accept/override — as a
            \ generic CLI over the one MCP implementation, so a Pi agent without MCP
            \ can run the entire ritual."
          verify:
          - git config --get core.hooksPath prints ~/.hermes-cortex/hooks — so a commit made from a Pi session is gated.
          - python3 ~/.hermes-cortex/scripts/loop-gov.py --list lists begin_change and end_change.
          - "The CLI works under EVERY interpreter shape, and the skew that broke gisu (2026-10-20) is now a WARNING, not a failure — with no `mcp` at all the handlers run through their own stand-ins, with mcp>=2.0 the SDK is used, and an mcp in between (importable but too old for the 2.0 constructor API this server registers handlers with) used to kill the module at import and make the CLI exit 3 on every write gate, which read as governance being unavailable. It now prints on stderr `[mcp-server] WARNING: the installed MCP SDK cannot serve this module (<error>) — stdio serving is DISABLED; the CLI adapter still works` and the CLI exits 0/1 as usual. Seeing that warning means THE INTERPRETER's mcp is behind — the extension spawns CORTEX_GOVERNANCE_PYTHON, defaulting to `python3` from pi's PATH — not that governance is down. Fix it by running the CLI with ~/.hermes-cortex/venv/bin/python3, or repair that venv with `python3 ops/scripts/manage/fix-cortex-venv.py` (its --check probes this capability, not just the import)."
          - python3 ~/.hermes-cortex/scripts/loop-gov.py check_lock returns a JSON status object (the CLI reaches the governance store). Note: its 'active' field is NOT the test the push gate uses — a lock FILE can exist (and permit a push) while check_lock reports inactive, so an inactive reading must not be taken as permission to push.
          - python3 ~/.hermes-cortex/scripts/loop-gov.py begin_change '{"task_id":"pi-smoke","description":"probe"}' returns a cycle id and end_change releases it — run this only when you hold no other lock.
        why: |
          Pi >= 0.99 gained an MCP client and reads user-scope servers from
          ~/.pi/agent/mcp.json, so the five cortex servers (loop-governance,
          tasks, executor, agent-bus, cortex-context) register exactly like Claude
          Code's — one
          implementation, one way in per harness. On an older Pi with no MCP
          client the commit-time git hooks STILL govern (core.hooksPath is
          global, so a Pi commit runs the same gates as a Hermes one), and
          ops/scripts/loop-gov.py is the CLI way in for the interactive ritual.
        verify:
          - 'pi mcp list shows loop-governance, tasks, executor, agent-bus, cortex-context.'
          - 'A commit made from a Pi session passes the hooks (or names the gate it hit).'
      governance-gate:
        # THE GAP THIS CLOSES (2026-10-14, titus). Hermes enforces governance at the
        # TOOL level via its enforcer plugin, which runs inside the Hermes agent
        # loop. Pi's read/bash/edit/write are pi-NATIVE and never cross it, and the
        # loop-governance MCP server is a tool SURFACE — it can hand the agent
        # begin_change but it cannot see a native write. So a Pi session could edit
        # and write files with NO lock. The commit-time hook IS a second layer, but
        # its lock check is scoped to the hermes-cortex repo only, so a Pi session
        # in a PROJECT repo had no lock gate at write OR commit time.
        #
        # This is the INTERACTIVE gate (a native tool call); `governance` above is
        # how the agent REACHES the tools. Both are needed and neither implies the
        # other — they are separate capabilities for that reason.
        adapter: extension
        register: ops/scripts/install/install-pi-integration.sh
        from: pi/extensions/cortex-governance.ts
        requires: 'pi whose tool_call hook can block — verified by loading the extension through pi''s own loader, never assumed from a version in a doc'
        why: |
          The extension registers ONLY a tool_call handler and adds NO governance
          semantics: it asks the SHARED implementation (loop-gov.py over
          loop-gov-mcp.py's `check_repo_lock` predicate) and blocks the call when
          that refuses. Re-implementing "does a lock cover this repo" per harness
          is how the rule stops binding — the git hook already carries one copy.
          Bash is classified by a read-only ALLOWLIST, deny by default, never by
          shell syntax: `cp`, `mv`, `rm`, `tee`, `dd` contain no metacharacter, so a
          syntax-based rule let every one of them through. Every cannot-verify path
          (CLI missing, governance unreachable, no repo resolvable) fails CLOSED,
          with the cost stated in the message and no agent-side override.
        verify:
          - 'node ops/install/harnesses/pi/verify-governance-extension.mjs exits 0 — it EXECUTES the gate, asserts both directions, and includes the no-metacharacter write commands.'
          - 'loop-gov.py check_repo_lock against the session repo exits 0 while a lock covers it and 1 when none does.'
          - 'In a Pi session with no lock a write is refused with GOVERNANCE LOCK REQUIRED; after begin_change the same write succeeds.'
    # Built-in tools only: the memory/session surface is NOT a --tools entry any
    # more — it arrives over MCP, so there is no per-harness tool list left to
    # rot when the contract grows.
    tools_base: [read, bash, edit, write]
    run: |
      pi   # tools come from ~/.pi/agent/mcp.json (install-pi-mcp.sh)
    verify:
      - 'pi mcp list shows cortex-context with the memory/session tools.'
      - 'In a Pi session call mem_context — the peer card must come back.'
      - 'Let a turn end with a decision, then: cortex-context session_restore "{}" | grep <marker>'
      - 'Start a second session; the checkpoint must appear unasked (`CORTEX_RESUME` in `~/.hermes-cortex/logs/pi-context.log`).'
      - 'node ops/install/harnesses/pi/verify-governance-extension.mjs exits 0 — it EXECUTES the write gate and asserts both directions.'
      - 'In a Pi session, with no lock: writing a file is refused with GOVERNANCE LOCK REQUIRED; after begin_change it succeeds.'
    # The extension's own knobs. Routine markers go to the cortex log, never the
    # prompt area, so a diagnosing agent needs to know where to look.
    env_optional:
      - CORTEX_CONTEXT_CLI
      - CORTEX_CONTEXT_PYTHON
      - {CORTEX_CONTEXT_LOG: 'default: ~/.hermes-cortex/logs/pi-context.log'}
      - {CORTEX_CONTEXT_LOG_MAX_BYTES: 'default: 1 MiB; rotates to <log>.1'}
      - {CORTEX_CONTEXT_DEBUG: '1 = echo routine markers to stderr while diagnosing'}

  - name: hermes
    layer: mcp
    status: shipped
    presence:
      - ~/.hermes/config.yaml
    surface: 'hermes mcp add'
    why: Hermes reads MCP servers from config, so it needs no shim at all.
    install: |
      hermes mcp add cortex-context \
          --command ~/.hermes-cortex/venv/bin/python3 \
          --args ~/hermes-cortex/mcp-servers/cortex-context-mcp.py
    verify:
      - 'hermes mcp list | grep cortex-context'
      - 'Call mcp__cortex_context__mem_context; the peer card must come back.'
    triggers:
      note: 'Harness side: ops/scripts/session-autocheckpoint.py at a boundary, or a cron.'

  - name: claude-code
    layer: mcp
    status: documented
    presence:
      - ~/.claude.json
      - ~/.claude/settings.json
      - cmd:claude
    surface: '.mcp.json'
    why: MCP-native; registration is a config entry, no shim.
    install: |
      Add to .mcp.json:
        {"mcpServers": {"cortex-context": {"command": "python3",
          "args": ["<mcp_server>"]}}}
    verify:
      - 'claude mcp list  (or /mcp) shows cortex-context'
      - 'Call mem_context; the peer card must come back.'

  - name: codex
    layer: mcp
    status: documented
    presence:
      - ~/.codex/config.toml
      - cmd:codex
    surface: '~/.codex/config.toml [mcp_servers]'
    why: MCP-native; registration is a config entry, no shim.
    install: |
      Add to ~/.codex/config.toml:
        [mcp_servers.cortex-context]
        command = "python3"
        args = ["<mcp_server>"]
    verify:
      - 'codex mcp list shows cortex-context'
      - 'Call mem_context; the peer card must come back.'

  - name: steadfaste-tui
    layer: none
    status: blocked
    # No presence to declare: this harness is declared UNSUPPORTED, so the doctor
    # reports it as skipped with this entry's own reason — never as "not installed",
    # which would read as "it would work if you installed it".
    presence: []
    surface: unknown
    why: |
      Steadfaste's own gateway is not complete, so its harness surface cannot be
      designed against it yet. Declared here with the reason rather than guessed
      at: a wrong layer means a wiring that "exists" and does nothing.
    verify: []
