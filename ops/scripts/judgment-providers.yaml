# Judgment provider config — Jev/von hot-swap routing.
# Design: steadfaste docs/design/judgment-abstraction.md
# Secrets come from env vars only (api_key_env names), never this file.
#
# Shadow mode is PROBATION-GATED: a class gets a `shadow:` entry only while a
# candidate provider is under evaluation; remove it once divergence gates pass.
# Global kill switch: JUDGMENT_SHADOW=off. Fail-closed: all-fail -> caller escalates.

providers:
  jev:
    base_url: https://api.typesafe.ai
    api_key_env: TYPESAFE_API_KEY
    model_id: jev-latest
    profile:
      accuracy_tier: T2
      composite: 63.3
      calibration: 76.3
      source: JevBench v1.4 (2026-09-29)
  von:
    base_url: http://127.0.0.1:8000
    api_key_env: VON_BEARER_TOKEN
    model_id: von-1.2.0
    profile:
      accuracy_tier: T3
      composite: 27.5
      calibration: 75.7
      source: JevBench v1.4 + wfzyx/von README (2026-09-29)

tiers:
  T1: 2
  T2: 1
  T3: 0

routing:
  decision_classes:
    bus-triage:
      primary: jev
      fallback: []
      shadow:
        provider: von
        mode: adaptive        # intelligent shadow: uncertain calls always
        confidence_floor: 0.95  # shadowed; confident calls sampled, decaying
        sample_rate: 0.2        # to a 2% drift canary as von proves itself
        decay_after_clean: 50
    bus-dedup:
      primary: jev
      fallback: []
    doc-freshness:
      primary: jev
      fallback: []
    health-triage:
      primary: jev
      fallback: []
      min_tier: T2
    verification-fanout:
      primary: jev
      fallback: []
      min_tier: T2         # von may NEVER auto-serve this until tier validated
    review-triage:
      # Adversarial-gate finding triage. Jev is a SYSTEM ONE classifier: it takes
      # typed questions (noul|choice|score) and returns typed answers — never a
      # chat prompt — so consumers must use ops/scripts/judgment.py, not an LLM
      # completion. Thresholds live in the caller (loop-gov-mcp.NOUL_TRUE).
      # von is protocol-compatible but T3 < T2, so it is INELIGIBLE here by the
      # tier gate until its accuracy is validated: an ineligible fallback is
      # skipped and the call fails closed (triage unavailable -> reviewer
      # severities stand, which is safe). Do not lower min_tier to "make the
      # fallback work" — validate von's tier first.
      primary: jev
      fallback: [von]
      min_tier: T2
