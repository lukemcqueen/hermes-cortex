# ── Agent Bus nginx config template ──
# Deploy: sudo cp this to /etc/nginx/sites-available/hermes-services.conf
# (or merge into your existing multi-app config)
#
# TWO SECURITY MODELS:
#
# Model A: auth_basic (simpler — what's running on the primary server)
#   Replace {{CERT_PATH}}, {{KEY_PATH}} with your SSL cert paths
#   Manage users: sudo htpasswd /etc/nginx/.hermes-htpasswd <username>
#   The `/.well-known/agent-card.json` public exception is commented out
#   by default — uncomment if you need A2A discovery without auth.
#
# Model B: mTLS (stronger auth)
#   Uncomment the ssl_client_certificate / ssl_verify_client / ssl_crl lines
#   and generate per-agent client certs with your CA.
#   The mTLS model already has a public exception for /.well-known/agent-card.json
#   via ssl_verify_client off + auth_basic off.

limit_req_zone $binary_remote_addr zone=bus:10m rate=30r/m;

server {
    listen {{PORT}} ssl;
    server_name localhost;

    # ── TLS —─
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:BusSSL:10m;
    ssl_session_timeout 10m;

    # ── SSL certificates ──
    ssl_certificate     {{CERT_PATH}};
    ssl_certificate_key {{KEY_PATH}};

    # ── Model B: mTLS — uncomment for client certificate auth ──
    # ssl_verify_client on;
    # ssl_client_certificate {{CA_PATH}};
    # ssl_verify_depth 2;
    # ssl_crl {{CRL_PATH}};

    # ── Model A: Basic Auth (active by default) ──
    auth_basic "Agent Bus";
    auth_basic_user_file /etc/nginx/.hermes-htpasswd;

    # ── Security headers ──
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "DENY" always;
    add_header X-XSS-Protection          "0" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy        "camera=(), microphone=(), geolocation=()" always;
    add_header Cache-Control             "no-store, max-age=0" always;
    proxy_hide_header Server;
    add_header Server "Hermes" always;

    # ── Request limits ──
    client_max_body_size 50m;
    client_body_timeout 30s;
    client_header_timeout 30s;
    send_timeout 30s;
    limit_conn conn_limit 10;
    limit_req zone=bus burst=10 nodelay;

    # ── Direct IP access denied ──
    if ($block_direct_ip) {
        return 444;
    }

    access_log  /var/log/nginx/agent-bus-access.log;
    error_log   /var/log/nginx/agent-bus-error.log;

    # ── Sensitive path blocking ──
    location ~ /\.(git|env|svn|hg|idea|vscode|DS_Store|htpasswd) {
        deny all;
        return 404;
    }

    # ── Public agent card — uncomment for A2A discovery without auth ──
    # location = /.well-known/agent-card.json {
    #     auth_basic off;
    #     limit_req zone=bus burst=10 nodelay;
    #     proxy_pass http://agent_bus_backend;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Real-IP $remote_addr;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #     proxy_set_header X-Forwarded-Proto $scheme;
    #     add_header Cache-Control "max-age=3600, public";
    #     add_header Access-Control-Allow-Origin "*";
    # }

    # ── All other endpoints (auth required) ──
    location / {
        limit_req zone=bus burst=10 nodelay;
        proxy_pass http://agent_bus_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
    }
}
